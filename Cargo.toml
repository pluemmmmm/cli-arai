[package]
name = "cli-arai"
version = "0.1.0"
edition = "2021"
description = "AI-powered Desktop App & CLI with embedded Rune scripting language, Diff UI, and split terminal"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
eframe = "0.31"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
rune = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["full"] }
