name: Release Build (macOS, Windows, Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            asset_name: cli-arai-macos-arm64.dmg
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            asset_name: cli-arai-macos-x64.dmg
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: cli-arai-windows-x64.zip
          - name: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: cli-arai-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package macOS .dmg installer (drag to Applications)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          DMG_STAGE="dist/dmg"
          APP_DIR="$DMG_STAGE/cli-arai.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "target/${{ matrix.target }}/release/cli-arai" "$APP_DIR/Contents/MacOS/cli-arai"
          chmod +x "$APP_DIR/Contents/MacOS/cli-arai"
          cat > "$APP_DIR/Contents/Info.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>cli-arai</string>
            <key>CFBundleDisplayName</key>
            <string>cli arai</string>
            <key>CFBundleIdentifier</key>
            <string>com.cliarai.app</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleExecutable</key>
            <string>cli-arai</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$APP_DIR"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create \
            -volname "cli arai" \
            -srcfolder "$DMG_STAGE" \
            -ov \
            -format UDZO \
            "${{ matrix.asset_name }}"

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cli-arai.exe" "dist/cli-arai.exe"
          Compress-Archive -Path "dist/cli-arai.exe" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package Linux tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cli-arai" "dist/cli-arai"
          chmod +x "dist/cli-arai"
          tar -czf "${{ matrix.asset_name }}" -C dist cli-arai

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
